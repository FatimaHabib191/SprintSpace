# Render Blueprint: Express API. Create via Dashboard > New > Blueprint.
services:
  - type: web
    name: sprintspace-api
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false            # paste your Atlas connection string
      - key: JWT_SECRET
        generateValue: true    # Render generates a long random value
      - key: CLIENT_ORIGIN
        sync: false            # e.g. https://sprintspace.vercel.app
      - key: COOKIE_SAMESITE
        value: lax             # Vercel proxies /api, so the cookie is first-party (see README)
